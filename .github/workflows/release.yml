name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Install, test, build, and pack only. Do not publish.'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Resolve version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${TAG} from package.json ${VERSION}"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "Tag ${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release notes
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          NOTES=$(python3 - <<'PY'
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          chunks = text.split('\n## ')
          print((chunks[1] if len(chunks) > 1 else text).strip())
          PY
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
